<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>С днём рождения, Саша!</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% 8%, rgba(96, 165, 250, 0.34), transparent 34%),
        radial-gradient(circle at 92% 18%, rgba(244, 114, 182, 0.28), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(147, 197, 253, 0.24), transparent 38%),
        #ffffff;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(44px);
      pointer-events: none;
      animation: orbMove 8s ease-in-out infinite;
    }

    .orb.one {
      width: 220px;
      height: 220px;
      left: -90px;
      top: 40px;
      background: rgba(59, 130, 246, 0.28);
    }

    .orb.two {
      width: 230px;
      height: 230px;
      right: -90px;
      top: 210px;
      background: rgba(236, 72, 153, 0.22);
      animation-delay: -2s;
    }

    .orb.three {
      width: 280px;
      height: 280px;
      left: 50%;
      bottom: -160px;
      transform: translateX(-50%);
      background: rgba(125, 211, 252, 0.22);
      animation-delay: -4s;
    }

    @keyframes orbMove {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(14px, -12px, 0) scale(1.08); }
    }

    .title {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 380px;
      margin: 4px 0 8px;
      padding-bottom: 0.08em;
      text-align: center;
      font-size: clamp(38px, 13.5vw, 62px);
      line-height: 1.02;
      letter-spacing: -0.055em;
      font-weight: 950;
    }

    .title span {
      display: block;
      padding: 0.02em 0 0.08em;
      background: linear-gradient(100deg, #2563eb 0%, #111827 45%, #ec4899 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stage {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      max-width: 430px;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: visible;
    }

    .bubble-layer {
      position: absolute;
      inset: 0;
      z-index: 30;
      overflow: visible;
      pointer-events: none;
    }

    .character-card {
      position: relative;
      z-index: 5;
      width: min(62vw, 252px);
      aspect-ratio: 3 / 5;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 22px 65px rgba(15, 23, 42, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn 700ms cubic-bezier(.2,.9,.2,1) both;
    }

    .character-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .character-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,.28), transparent 46%, rgba(0,0,0,.05));
    }

    .bubble {
      z-index: 40;
      position: absolute;
      left: var(--start-x);
      top: var(--start-y);
      z-index: 18;
      max-width: 138px;
      padding: 9px 11px;
      border-radius: 18px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.11);
      color: rgba(17, 24, 39, 0.84);
      font-size: 12px;
      font-weight: 760;
      line-height: 1.08;
      letter-spacing: -0.02em;
      opacity: 0;
      will-change: transform, opacity;
      transform: translate3d(-50%, -50%, 0) scale(0.76);
      animation: bubbleFloat var(--duration) cubic-bezier(.16,.84,.28,1) forwards;
    }

    .bubble::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(96,165,250,.13), rgba(255,255,255,.08), rgba(244,114,182,.14));
      pointer-events: none;
    }

    .bubble span {
      position: relative;
      z-index: 1;
    }

    .dog-wrap {
      position: absolute;
      left: 50%;
      bottom: clamp(28px, 7svh, 58px);
      z-index: 12;
      width: 124px;
      height: 104px;
      transform: translateX(-50%);
      animation: dogIn 650ms cubic-bezier(.2,.9,.2,1) 900ms both, dogFloat 3.4s ease-in-out 1.5s infinite;
    }

    .dog-blanket {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 108px;
      height: 52px;
      transform: translateX(-50%);
      border-radius: 28px 28px 22px 22px;
      background: linear-gradient(135deg, #b7f7da, #7dd3fc);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
    }

    .dog-head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 98px;
      height: 88px;
      transform: translateX(-50%);
      border-radius: 54% 54% 48% 48%;
      background: #ffffff;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.13), inset 0 -7px 16px rgba(15, 23, 42, 0.035);
    }

    .dog-ear {
      position: absolute;
      top: 19px;
      width: 36px;
      height: 46px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    .dog-ear.left {
      left: 0;
      transform: rotate(-24deg);
    }

    .dog-ear.right {
      right: 0;
      transform: rotate(24deg);
    }

    .dog-eye {
      position: absolute;
      top: 40px;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #111827;
      transform-origin: center;
      animation: blink 4.2s infinite;
    }

    .dog-eye.left { left: 32px; }
    .dog-eye.right { right: 32px; }

    .dog-nose {
      position: absolute;
      left: 50%;
      top: 56px;
      width: 12px;
      height: 9px;
      transform: translateX(-50%);
      border-radius: 60% 60% 70% 70%;
      background: #111827;
    }

    .caption {
      position: relative;
      z-index: 20;
      width: min(100%, 360px);
      margin: 0;
      padding: 14px 16px;
      border-radius: 24px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 16px 44px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: rgba(17, 24, 39, 0.62);
      text-align: center;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -0.055em;
      line-height: 0.98;
      animation: cardIn 700ms cubic-bezier(.2,.9,.2,1) 1.1s both;
    }

    .sound-button {
      display: none;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.96); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes bubbleFloat {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(.72) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) * .82), calc(var(--y) * .82), 0) scale(1) rotate(calc(var(--r) * .7));
      }
      78% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(var(--x), var(--y), 0) scale(1) rotate(var(--r));
      }
      100% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) + var(--drift-x)), calc(var(--y) + var(--drift-y)), 0) scale(.98) rotate(var(--r));
      }
    }

    @keyframes dogIn {
      from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.86); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes dogFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }

    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); }
      94%, 96% { transform: scaleY(.08); }
    }

    @media (max-height: 720px) {
      .title {
        font-size: clamp(34px, 12vw, 50px);
        margin-bottom: 2px;
      }

      .character-card {
        width: min(54vw, 210px);
        border-radius: 30px;
      }

      .stage {
        transform: translateY(-4px);
      }

      .dog-wrap {
        transform: translateX(-50%) scale(.86);
        bottom: 24px;
      }

      .caption {
        font-size: 17px;
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <h1 class="title">
      <span>С днём рождения</span>
      <span>Саша!</span>
    </h1>

    <section class="stage" aria-label="Поздравление">
      <div class="bubble-layer" id="bubbleLayer"></div>

      <div class="character-card">
        <video
          src="https://app-uploads.krea.ai/public/73faff13-1604-4047-acdc-5a35d13f68b3-video.mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>
      </div>

      <div class="dog-wrap" aria-label="Моргающая собачка">
        <div class="dog-blanket"></div>
        <div class="dog-ear left"></div>
        <div class="dog-ear right"></div>
        <div class="dog-head">
          <div class="dog-eye left"></div>
          <div class="dog-eye right"></div>
          <div class="dog-nose"></div>
        </div>
      </div>
    </section>

    <p class="caption">Пусть этот день будет особенным</p>

    
  </main>

  <script>
    const messages = [
      "С днём рождения ✨",
      "Саша, сияй!",
      "Сегодня твой день",
      "Пусть всё получится",
      "Счастья и лёгкости",
      "Ты прекрасна",
      "Make a wish",
      "Новый яркий год",
      "Любви и вдохновения",
      "Магии в каждом дне",
      "Больше красивых моментов",
      "Пусть мечты сбываются",
      "Улыбок до неба",
      "Нежности и тепла",
      "Ты — космос",
      "Праздник начинается",
      "Всё лучшее впереди",
      "Много-много радости",
      "Пусть будет вау",
      "Обнимаем крепко",
      "Самых добрых чудес",
      "Больше света",
      "Больше любви",
      "Больше свободы",
      "Больше смеха",
      "Сбывшихся желаний",
      "Красивых путешествий",
      "Музыки в сердце",
      "Тёплых людей рядом",
      "Пусть год будет твоим",
      "Ты заслуживаешь всё",
      "Happy Sasha day",
      "Сияй ярче",
      "Твой новый level",
      "Пусть будет легко",
      "Невероятных эмоций",
      "Сладких моментов",
      "Праздничного настроения",
      "Любимых рядом",
      "Вдохновения каждый день",
      "Больших побед",
      "Маленьких чудес",
      "Ты делаешь мир ярче",
      "Самый тёплый день",
      "Саша, с праздником!"
    ];

    const layer = document.getElementById("bubbleLayer");
    const stage = document.querySelector(".stage");
    const characterVideo = document.querySelector(".character-card video");
    // sound removed

    let audioUnlocked = true;
    let messageIndex = 0;
    let bubbleTimer = null;
    const order = shuffle(messages.length);

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shuffle(length) {
      const arr = Array.from({ length }, (_, index) => index);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function playBubbleSound() {
      // disabled
    });
    }

    function unlockAudio() {
      // disabled
    })
        .catch(() => {
          audioUnlocked = false;
        });
    }

    function spawnBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<span>${message}</span>`;

      const rect = stage.getBoundingClientRect();
      const card = document.querySelector(".character-card");
      const cardRect = card.getBoundingClientRect();

      const stageWidth = rect.width;
      const stageHeight = rect.height;
      const centerX = stageWidth / 2;
      const centerY = stageHeight / 2;

      const avatarLeft = cardRect.left - rect.left;
      const avatarRight = cardRect.right - rect.left;
      const avatarTop = cardRect.top - rect.top;
      const avatarBottom = cardRect.bottom - rect.top;

      const zones = [
        {
          startX: randomBetween(centerX - 60, centerX + 60),
          startY: avatarTop - 20,
          targetX: randomBetween(76, stageWidth - 76),
          targetY: randomBetween(42, Math.max(80, avatarTop - 42)),
        },
        {
          startX: avatarLeft - 12,
          startY: randomBetween(avatarTop + 50, avatarBottom - 70),
          targetX: randomBetween(62, Math.max(86, avatarLeft - 42)),
          targetY: randomBetween(96, stageHeight - 148),
        },
        {
          startX: avatarRight + 12,
          startY: randomBetween(avatarTop + 50, avatarBottom - 70),
          targetX: randomBetween(Math.min(stageWidth - 86, avatarRight + 42), stageWidth - 62),
          targetY: randomBetween(96, stageHeight - 148),
        },
        {
          startX: randomBetween(centerX - 80, centerX + 80),
          startY: avatarBottom + 14,
          targetX: randomBetween(80, stageWidth - 80),
          targetY: randomBetween(Math.min(stageHeight - 150, avatarBottom + 46), stageHeight - 112),
        }
      ];

      const zone = zones[Math.floor(Math.random() * zones.length)];

      bubble.style.setProperty("--start-x", `${zone.startX}px`);
      bubble.style.setProperty("--start-y", `${zone.startY}px`);
      bubble.style.setProperty("--x", `${zone.targetX - zone.startX}px`);
      bubble.style.setProperty("--y", `${zone.targetY - zone.startY}px`);
      bubble.style.setProperty("--drift-x", `${randomBetween(-12, 12).toFixed(1)}px`);
      bubble.style.setProperty("--drift-y", `${randomBetween(-8, 8).toFixed(1)}px`);
      bubble.style.setProperty("--r", `${randomBetween(-6, 6).toFixed(2)}deg`);
      bubble.style.setProperty("--duration", `${randomBetween(7.4, 9.2).toFixed(2)}s`);

      layer.appendChild(bubble);
      playBubbleSound();

      bubble.addEventListener("animationend", () => {
        bubble.remove();
      }, { once: true });
    }

    function tick() {
      if (messageIndex >= messages.length) {
        if (bubbleTimer) {
          window.clearInterval(bubbleTimer);
          bubbleTimer = null;
        }
        audioUnlocked = false;
        return;
      }

      const index = order[messageIndex];
      spawnBubble(messages[index]);
      messageIndex += 1;
    }

    function startMessages() {
      tick();
      bubbleTimer = window.setInterval(tick, 540);
    }

    

    window.addEventListener("load", () => {
      if (characterVideo) {
        characterVideo.muted = true;
        characterVideo.play().catch(() => {});
      }

      unlockAudio();
      window.setTimeout(startMessages, 450);
    });
  </script>
</body>
</html>
