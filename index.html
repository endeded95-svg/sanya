<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>С днём рождения, Саша!</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.2svh, 28px);
      padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% 8%, rgba(96, 165, 250, 0.34), transparent 34%),
        radial-gradient(circle at 92% 18%, rgba(244, 114, 182, 0.28), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(147, 197, 253, 0.24), transparent 38%),
        #ffffff;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(44px);
      pointer-events: none;
      animation: orbMove 8s ease-in-out infinite;
    }

    .orb.one {
      width: 220px;
      height: 220px;
      left: -90px;
      top: 40px;
      background: rgba(59, 130, 246, 0.28);
    }

    .orb.two {
      width: 230px;
      height: 230px;
      right: -90px;
      top: 210px;
      background: rgba(236, 72, 153, 0.22);
      animation-delay: -2s;
    }

    .orb.three {
      width: 280px;
      height: 280px;
      left: 50%;
      bottom: -160px;
      transform: translateX(-50%);
      background: rgba(125, 211, 252, 0.22);
      animation-delay: -4s;
    }

    @keyframes orbMove {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(14px, -12px, 0) scale(1.08); }
    }

    .title {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 380px;
      margin: 0;
      padding-bottom: 0.08em;
      text-align: center;
      font-size: clamp(38px, 13.5vw, 62px);
      line-height: 1.02;
      letter-spacing: -0.055em;
      font-weight: 950;
    }

    .title span {
      display: block;
      padding: 0.02em 0 0.08em;
      background: linear-gradient(100deg, #2563eb 0%, #111827 45%, #ec4899 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stage {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 430px;
      height: min(54svh, 520px);
      min-height: 430px;
      display: grid;
      place-items: center;
      overflow: visible;
      flex: 0 0 auto;
    }

    .bubble-layer {
      position: fixed;
      inset: 0;
      z-index: 999;
      overflow: visible;
      pointer-events: none;
    }

    .character-card {
      position: relative;
      z-index: 10;
      width: min(62vw, 252px);
      aspect-ratio: 3 / 5;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 22px 65px rgba(15, 23, 42, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn 700ms cubic-bezier(.2,.9,.2,1) both;
    }

    .character-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .character-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,.28), transparent 46%, rgba(0,0,0,.05));
    }

    .bubble {
      position: fixed;
      left: var(--start-x);
      top: var(--start-y);
      z-index: 1000;
      max-width: 156px;
      padding: 10px 12px;
      border-radius: 18px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.18);
      color: rgba(17, 24, 39, 0.9);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      opacity: 0;
      will-change: transform, opacity;
      transform: translate3d(-50%, -50%, 0) scale(0.76);
      animation: bubbleFloat var(--duration) cubic-bezier(.16,.84,.28,1) forwards;
    }

    .bubble::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(96,165,250,.16), rgba(255,255,255,.08), rgba(244,114,182,.16));
      pointer-events: none;
    }

    .bubble span {
      position: relative;
      z-index: 1;
    }

    .dog-wrap {
      position: absolute;
      left: 50%;
      bottom: clamp(12px, 5svh, 32px);
      z-index: 20;
      width: 124px;
      height: 104px;
      transform: translateX(-50%);
      animation: dogIn 650ms cubic-bezier(.2,.9,.2,1) 900ms both, dogFloat 3.4s ease-in-out 1.5s infinite;
    }

    .dog-blanket {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 108px;
      height: 52px;
      transform: translateX(-50%);
      border-radius: 28px 28px 22px 22px;
      background: linear-gradient(135deg, #b7f7da, #7dd3fc);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
    }

    .dog-head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 98px;
      height: 88px;
      transform: translateX(-50%);
      border-radius: 54% 54% 48% 48%;
      background: #ffffff;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.13), inset 0 -7px 16px rgba(15, 23, 42, 0.035);
    }

    .dog-ear {
      position: absolute;
      top: 19px;
      width: 36px;
      height: 46px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    .dog-ear.left {
      left: 0;
      transform: rotate(-24deg);
    }

    .dog-ear.right {
      right: 0;
      transform: rotate(24deg);
    }

    .dog-eye {
      position: absolute;
      top: 40px;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #111827;
      transform-origin: center;
      animation: blink 4.2s infinite;
    }

    .dog-eye.left { left: 32px; }
    .dog-eye.right { right: 32px; }

    .dog-nose {
      position: absolute;
      left: 50%;
      top: 56px;
      width: 12px;
      height: 9px;
      transform: translateX(-50%);
      border-radius: 60% 60% 70% 70%;
      background: #111827;
    }

    .caption {
      position: relative;
      z-index: 20;
      width: min(100%, 360px);
      margin: 0;
      padding: 14px 16px;
      border-radius: 24px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 16px 44px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: rgba(17, 24, 39, 0.62);
      text-align: center;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -0.055em;
      line-height: 0.98;
      animation: cardIn 700ms cubic-bezier(.2,.9,.2,1) 1.1s both;
      flex: 0 0 auto;
    }

    .dog-thought {
      position: absolute;
      left: calc(50% + 32px);
      bottom: 110px;
      z-index: 60;
      min-width: 128px;
      padding: 14px 18px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.14);
      color: #111827;
      text-align: center;
      font-family: "Comic Sans MS", "Marker Felt", "Segoe Print", cursive;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      opacity: 0;
      transform: translateX(-50%) translateY(12px) scale(0.72) rotate(-4deg);
      pointer-events: none;
    }

    .dog-thought::before,
    .dog-thought::after {
      width: 10px;
      height: 10px;
      left: 34px;
      bottom: -30px;
    }

    .dog-thought::before {
      width: 18px;
      height: 18px;
      left: 48px;
      bottom: -16px;
    }

    .dog-thought::after {
      width: 10px;
      height: 10px;
      left: 25px;
      bottom: -30px;
    }

    .dog-thought.show {
      animation: thoughtIn 680ms cubic-bezier(.2,.9,.2,1) both, thoughtFloat 3.2s ease-in-out 900ms infinite;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.96); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes bubbleFloat {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(.72) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) * .82), calc(var(--y) * .82), 0) scale(1) rotate(calc(var(--r) * .7));
      }
      82% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(var(--x), var(--y), 0) scale(1) rotate(var(--r));
      }
      100% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) + var(--drift-x)), calc(var(--y) + var(--drift-y)), 0) scale(.98) rotate(var(--r));
      }
    }

    @keyframes thoughtIn {
      from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.72) rotate(-4deg); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1) rotate(-4deg); }
    }

    @keyframes thoughtFloat {
      0%, 100% { transform: translateX(-50%) translateY(0) scale(1) rotate(-4deg); }
      50% { transform: translateX(-50%) translateY(-5px) scale(1.02) rotate(-3deg); }
    }

    @keyframes dogIn {
      from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.86); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes dogFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }

    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); }
      94%, 96% { transform: scaleY(.08); }
    }

    @media (max-height: 720px) {
      .page {
        gap: 12px;
      }

      .title {
        font-size: clamp(34px, 12vw, 50px);
      }

      .character-card {
        width: min(54vw, 210px);
        border-radius: 30px;
      }

      .stage {
        height: 50svh;
        min-height: 365px;
      }

      .dog-wrap {
        transform: translateX(-50%) scale(.86);
        bottom: 10px;
      }

      .dog-thought {
        left: calc(50% + 26px);
        bottom: 92px;
        font-size: 19px;
        min-width: 112px;
        padding: 12px 15px;
      }
      }

      .dog-thought {
        left: calc(50% + 26px);
        bottom: 122px;
        font-size: 19px;
        min-width: 112px;
        padding: 12px 15px;
      }

      .caption {
        font-size: 17px;
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <h1 class="title">
      <span>С Днем Рождения</span>
      <span>Саша!</span>
    </h1>

    <section class="stage" aria-label="Поздравление">
      <div class="bubble-layer" id="bubbleLayer"></div>

      <div class="character-card">
        <video
          src="https://app-uploads.krea.ai/public/73faff13-1604-4047-acdc-5a35d13f68b3-video.mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>
      </div>

      <div class="dog-thought" id="dogThought">С ДР! Тяв!</div>

      <div class="dog-wrap" aria-label="Моргающая собачка">
        <div class="dog-blanket"></div>
        <div class="dog-ear left"></div>
        <div class="dog-ear right"></div>
        <div class="dog-head">
          <div class="dog-eye left"></div>
          <div class="dog-eye right"></div>
          <div class="dog-nose"></div>
        </div>
      </div>
    </section>

    <p class="caption">Твои Н. и Б.</p>
  </main>

  <script>
    const messages = [
      "С днём рождения 🎉",
      "Саша, 🍰 хэппи бездей",
      "Пусть сегодня будет вау 🎉",
      "И весь год тоже",
      "Улыбок до ушей 😄",
      "Кайфа от каждого дня 🎉",
      "Побольше поводов радоваться",
      "🎉 Поменьше поводов париться",
      "Лёгкости во всём",
      "И удачи по пути",
      "Пусть всё складывается красиво",
      "👄",
      "Больше смеха",
      "Больше приключений",
      "Больше классных историй",
      "Пусть желания исполняются",
      "👄👄👄Чмок!",
      "Хороших людей рядом",
      "И верных друзей",
      "Чтобы всё получалось",
      "Чмок!👄👄👄",
      "Ярких моментов",
      "Тёплых вечеров",
      "Саша, будь счастлив",
      "🥳🥳🥳",
      "Пусть будет вкусно жить 🎂",
      "🍰🍰🍰",
      "Приятных сюрпризов🔥",
      "🎈🎈🎈🎈🎈",
      "Делай что нравится",
      "💐💐💐",
      "Ты самый красавый! Цвети дальше 💐",
      "Тявк! ",
      "С днём рождения 🚀"
    ];

    const layer = document.getElementById("bubbleLayer");
    const stage = document.querySelector(".stage");
    const characterVideo = document.querySelector(".character-card video");

    let messageIndex = 0;
    let bubbleTimer = null;
    const order = shuffle(messages.length);

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shuffle(length) {
      const arr = Array.from({ length }, (_, index) => index);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function spawnBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<span>${message}</span>`;

      const card = document.querySelector(".character-card");
      const cardRect = card.getBoundingClientRect();
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const centerX = cardRect.left + cardRect.width / 2;
      const centerY = cardRect.top + cardRect.height / 2;

      const zones = [
        {
          startX: centerX + randomBetween(-34, 34),
          startY: cardRect.top + 8,
          targetX: randomBetween(72, screenWidth - 72),
          targetY: randomBetween(96, Math.max(130, cardRect.top - 18))
        },
        {
          startX: cardRect.left + 8,
          startY: centerY + randomBetween(-80, 60),
          targetX: randomBetween(72, Math.max(96, cardRect.left - 20)),
          targetY: randomBetween(150, screenHeight - 170)
        },
        {
          startX: cardRect.right - 8,
          startY: centerY + randomBetween(-80, 60),
          targetX: randomBetween(Math.min(screenWidth - 96, cardRect.right + 20), screenWidth - 72),
          targetY: randomBetween(150, screenHeight - 170)
        },
        {
          startX: centerX + randomBetween(-40, 40),
          startY: cardRect.bottom - 12,
          targetX: randomBetween(72, screenWidth - 72),
          targetY: randomBetween(Math.min(screenHeight - 150, cardRect.bottom + 20), screenHeight - 118)
        }
      ];

      const zone = zones[Math.floor(Math.random() * zones.length)];

      bubble.style.setProperty("--start-x", `${zone.startX}px`);
      bubble.style.setProperty("--start-y", `${zone.startY}px`);
      bubble.style.setProperty("--x", `${zone.targetX - zone.startX}px`);
      bubble.style.setProperty("--y", `${zone.targetY - zone.startY}px`);
      bubble.style.setProperty("--drift-x", `${randomBetween(-10, 10).toFixed(1)}px`);
      bubble.style.setProperty("--drift-y", `${randomBetween(-8, 8).toFixed(1)}px`);
      bubble.style.setProperty("--r", `${randomBetween(-6, 6).toFixed(2)}deg`);
      bubble.style.setProperty("--duration", `${randomBetween(7.4, 9.2).toFixed(2)}s`);

      document.body.appendChild(bubble);

      bubble.addEventListener("animationend", () => {
        bubble.remove();
      }, { once: true });
    }

    function tick() {
      if (messageIndex >= messages.length) {
        if (bubbleTimer) {
          window.clearInterval(bubbleTimer);
          bubbleTimer = null;
        }
        window.setTimeout(() => {
          const thought = document.getElementById("dogThought");
          if (thought) thought.classList.add("show");
        }, 1200);
        return;
      }

      const index = order[messageIndex];
      spawnBubble(messages[index]);
      messageIndex += 1;
    }

    function startMessages() {
      tick();
      bubbleTimer = window.setInterval(tick, 540);
    }

    function init() {
      if (characterVideo) {
        characterVideo.muted = true;
        characterVideo.play().catch(() => {});
      }

      window.setTimeout(startMessages, 450);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
