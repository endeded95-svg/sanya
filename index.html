<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>С днём рождения, Саша!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111827;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 12% 12%, rgba(96, 165, 250, 0.28), transparent 31%),
        radial-gradient(circle at 88% 20%, rgba(244, 114, 182, 0.24), transparent 30%),
        radial-gradient(circle at 50% 95%, rgba(147, 197, 253, 0.2), transparent 36%),
        #ffffff;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(52px);
      opacity: 0.75;
      pointer-events: none;
      animation: floatOrb 9s ease-in-out infinite;
    }

    .orb-blue {
      width: 340px;
      height: 340px;
      left: -130px;
      top: 10px;
      background: rgba(59, 130, 246, 0.32);
    }

    .orb-pink {
      width: 360px;
      height: 360px;
      right: -150px;
      top: 18%;
      background: rgba(236, 72, 153, 0.24);
      animation-delay: -2s;
    }

    .orb-soft-blue {
      width: 420px;
      height: 420px;
      left: 35%;
      bottom: -220px;
      background: rgba(125, 211, 252, 0.24);
      animation-delay: -4s;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(24px, -18px, 0) scale(1.08); }
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(100%, 1120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 700ms ease both;
    }

    .title {
      position: relative;
      z-index: 12;
      margin: 0;
      max-width: 1120px;
      padding: 0 0 0.12em;
      font-size: clamp(40px, 8.5vw, 112px);
      line-height: 0.98;
      letter-spacing: -0.065em;
      font-weight: 950;
      overflow: visible;
    }

    .title span {
      display: block;
      padding: 0.04em 0 0.12em;
      background: linear-gradient(100deg, #2563eb 0%, #111827 44%, #ec4899 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stage {
      position: relative;
      width: min(960px, 100vw - 20px);
      height: min(760px, 78svh);
      min-height: 640px;
      margin-top: -2px;
      display: grid;
      place-items: center;
      overflow: visible;
    }

    .character-card {
      position: relative;
      z-index: 8;
      width: min(350px, 78vw);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 42px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.72);
      box-shadow:
        0 30px 90px rgba(15, 23, 42, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      animation: rise 800ms cubic-bezier(.2,.9,.2,1) 180ms both;
    }

    .character-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 45%, rgba(0,0,0,0.06));
    }

    .character-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bubble-layer {
      position: absolute;
      inset: -120px;
      z-index: 6;
      pointer-events: none;
      overflow: visible;
    }

    .bubble {
      position: absolute;
      left: var(--start-x);
      top: var(--start-y);
      width: max-content;
      max-width: 230px;
      padding: 12px 15px;
      border-radius: 22px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      font-size: 14px;
      font-weight: 760;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: rgba(17, 24, 39, 0.82);
      opacity: 0;
      will-change: transform, opacity;
      transform: translate3d(-50%, -50%, 0) scale(0.75);
      animation: bubbleFloat var(--duration) cubic-bezier(.16, .84, .28, 1) forwards;
    }

    .bubble::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.14), rgba(255,255,255,0.12), rgba(244, 114, 182, 0.12));
      pointer-events: none;
    }

    .bubble span {
      position: relative;
      z-index: 1;
    }

    .dog-wrap {
      position: absolute;
      left: 50%;
      bottom: 38px;
      z-index: 10;
      width: 148px;
      height: 124px;
      transform: translateX(-50%);
      animation: dogEnter 700ms cubic-bezier(.2,.9,.2,1) 1150ms both, dogFloat 3.6s ease-in-out 2s infinite;
    }

    .dog-blanket {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 126px;
      height: 62px;
      transform: translateX(-50%);
      border-radius: 31px 31px 24px 24px;
      background: linear-gradient(135deg, #b7f7da, #75d7ff);
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.12);
    }

    .dog-head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 118px;
      height: 104px;
      transform: translateX(-50%);
      border-radius: 54% 54% 48% 48%;
      background: #ffffff;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.14), inset 0 -8px 18px rgba(15, 23, 42, 0.035);
    }

    .dog-ear {
      position: absolute;
      top: 22px;
      width: 42px;
      height: 54px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .dog-ear.left {
      left: 0;
      transform: rotate(-24deg);
    }

    .dog-ear.right {
      right: 0;
      transform: rotate(24deg);
    }

    .dog-eye {
      position: absolute;
      top: 47px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #111827;
      transform-origin: center;
      animation: blink 4.2s infinite;
    }

    .dog-eye.left { left: 39px; }
    .dog-eye.right { right: 39px; }

    .dog-nose {
      position: absolute;
      left: 50%;
      top: 66px;
      width: 13px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 60% 60% 70% 70%;
      background: #111827;
    }

    .caption {
      position: relative;
      z-index: 12;
      margin: -2px 0 0;
      max-width: 620px;
      padding: 18px 22px;
      border-radius: 28px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      color: rgba(17, 24, 39, 0.62);
      font-size: clamp(18px, 3vw, 30px);
      font-weight: 850;
      letter-spacing: -0.06em;
      line-height: 0.95;
      animation: rise 700ms cubic-bezier(.2,.9,.2,1) 1500ms both;
    }

    .sound-button {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: rgba(17, 24, 39, 0.72);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 12px 16px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes bubbleFloat {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) translate3d(0, 0, 0) scale(0.72) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) * 0.82), calc(var(--y) * 0.82), 0) scale(1) rotate(calc(var(--r) * 0.7));
      }
      78% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(var(--x), var(--y), 0) scale(1) rotate(var(--r));
      }
      100% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) + var(--drift-x)), calc(var(--y) + var(--drift-y)), 0) scale(0.98) rotate(var(--r));
      }
    }

    @keyframes bubbleGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    @keyframes dogEnter {
      from { opacity: 0; transform: translateX(-50%) translateY(18px) scale(0.88); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes dogFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      94%, 96% { transform: scaleY(0.08); }
    }

    @media (max-width: 760px) {
      .title {
        font-size: clamp(36px, 13vw, 64px);
        line-height: 1.02;
        letter-spacing: -0.055em;
      }

      .stage {
        height: 650px;
        min-height: 620px;
        margin-top: 6px;
      }

      .character-card {
        width: min(300px, 82vw);
        border-radius: 36px;
      }

      .bubble {
        max-width: 160px;
        padding: 10px 12px;
        font-size: 12px;
      }

      .dog-wrap {
        bottom: 62px;
        transform: translateX(-50%) scale(0.86);
      }

      @keyframes dogEnter {
        from { opacity: 0; transform: translateX(-50%) translateY(18px) scale(0.78); }
        to { opacity: 1; transform: translateX(-50%) translateY(0) scale(0.86); }
      }

      @keyframes dogFloat {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(0.86); }
        50% { transform: translateX(-50%) translateY(-6px) scale(0.86); }
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="orb orb-blue"></div>
    <div class="orb orb-pink"></div>
    <div class="orb orb-soft-blue"></div>

    <section class="content" aria-label="Birthday greeting">
      <h1 class="title">
        <span>С днём рождения</span>
        <span>Саша!</span>
      </h1>

      <div class="stage">
        <div class="bubble-layer" id="bubbleLayer"></div>

        <div class="character-card">
          <video
            src="https://app-uploads.krea.ai/public/73faff13-1604-4047-acdc-5a35d13f68b3-video.mp4"
            autoplay
            muted
            loop
            playsinline
          ></video>
        </div>

        <div class="dog-wrap" aria-label="Blinking dog illustration">
          <div class="dog-blanket"></div>
          <div class="dog-ear left"></div>
          <div class="dog-ear right"></div>
          <div class="dog-head">
            <div class="dog-eye left"></div>
            <div class="dog-eye right"></div>
            <div class="dog-nose"></div>
          </div>
        </div>
      </div>

      <p class="caption">Пусть этот день будет особенным</p>
    </section>

    <button class="sound-button" id="soundButton" type="button">Нажми для звука</button>
    <audio id="bubbleSound" src="https://raw.githubusercontent.com/endeded95-svg/sanya/main/1_sound.wav" preload="auto"></audio>
  </main>

  <script>
    const messages = [
      "С днём рождения ✨",
      "Саша, сияй!",
      "Сегодня твой день",
      "Пусть всё получится",
      "Счастья и лёгкости",
      "Ты прекрасна",
      "Make a wish",
      "Новый яркий год",
      "Любви и вдохновения",
      "Магии в каждом дне",
      "Больше красивых моментов",
      "Пусть мечты сбываются",
      "Улыбок до неба",
      "Нежности и тепла",
      "Ты — космос",
      "Праздник начинается",
      "Всё лучшее впереди",
      "Много-много радости",
      "Пусть будет вау",
      "Обнимаем крепко",
      "Самых добрых чудес",
      "Больше света",
      "Больше любви",
      "Больше свободы",
      "Больше смеха",
      "Сбывшихся желаний",
      "Красивых путешествий",
      "Музыки в сердце",
      "Тёплых людей рядом",
      "Пусть год будет твоим",
      "Ты заслуживаешь всё",
      "Happy Sasha day",
      "Сияй ярче",
      "Твой новый level",
      "Пусть будет легко",
      "Невероятных эмоций",
      "Сладких моментов",
      "Праздничного настроения",
      "Любимых рядом",
      "Вдохновения каждый день",
      "Больших побед",
      "Маленьких чудес",
      "Ты делаешь мир ярче",
      "Самый тёплый день",
      "Саша, с праздником!"
    ];

    const layer = document.getElementById("bubbleLayer");
    const stage = document.querySelector(".stage");
    const soundButton = document.getElementById("soundButton");
    const soundUrl = "https://raw.githubusercontent.com/endeded95-svg/sanya/main/1_sound.wav";

    let audioUnlocked = false;
    let messageIndex = 0;
    let currentOrder = shuffle(messages.length);
    let bubbleTimer = null;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shuffle(length) {
      const arr = Array.from({ length }, (_, index) => index);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function playBubbleSound() {
      if (!audioUnlocked) return;

      const audio = new Audio(soundUrl);
      audio.volume = 0.18;
      audio.play().catch(() => {});
    }

    function unlockAudio() {
      const audio = new Audio(soundUrl);
      audio.volume = 0.01;

      audio.play()
        .then(() => {
          audio.pause();
          audio.currentTime = 0;
          audioUnlocked = true;
          soundButton.textContent = "Звук включён";
          soundButton.style.opacity = "0.55";
          window.setTimeout(() => {
            soundButton.style.display = "none";
          }, 700);
        })
        .catch(() => {
          audioUnlocked = true;
          soundButton.style.display = "none";
        });
    }

    function spawnBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<span>${message}</span>`;

      const stageWidth = stage.offsetWidth;
      const stageHeight = stage.offsetHeight;
      const centerX = stageWidth / 2;
      const centerY = stageHeight / 2;

      const startX = centerX + randomBetween(-38, 38);
      const startY = centerY + randomBetween(-34, 34);

      const safePaddingX = window.innerWidth < 760 ? 92 : 135;
      const safePaddingY = window.innerWidth < 760 ? 94 : 120;
      const safeMinX = safePaddingX;
      const safeMaxX = stageWidth - safePaddingX;
      const safeMinY = safePaddingY;
      const safeMaxY = stageHeight - safePaddingY;

      let targetX;
      let targetY;
      let attempts = 0;

      do {
        targetX = randomBetween(safeMinX, safeMaxX);
        targetY = randomBetween(safeMinY, safeMaxY);
        attempts += 1;
      } while (
        attempts < 20 &&
        Math.abs(targetX - centerX) < 140 &&
        Math.abs(targetY - centerY) < 135
      );

      bubble.style.setProperty("--start-x", `${startX}px`);
      bubble.style.setProperty("--start-y", `${startY}px`);
      bubble.style.setProperty("--x", `${targetX - startX}px`);
      bubble.style.setProperty("--y", `${targetY - startY}px`);
      bubble.style.setProperty("--drift-x", `${randomBetween(-24, 24).toFixed(1)}px`);
      bubble.style.setProperty("--drift-y", `${randomBetween(-18, 18).toFixed(1)}px`);
      bubble.style.setProperty("--r", `${randomBetween(-8, 8).toFixed(2)}deg`);
      bubble.style.setProperty("--duration", `${randomBetween(7.8, 10.5).toFixed(2)}s`);

      layer.appendChild(bubble);
      playBubbleSound();

      bubble.addEventListener("animationend", () => {
        bubble.remove();
      }, { once: true });
    }

    function tick() {
      if (messageIndex >= messages.length) {
        if (bubbleTimer) {
          window.clearInterval(bubbleTimer);
          bubbleTimer = null;
        }
        return;
      }

      const index = currentOrder[messageIndex];
      spawnBubble(messages[index]);
      messageIndex += 1;
    }

    function startMessages() {
      tick();
      bubbleTimer = window.setInterval(tick, 520);
    }

    soundButton.addEventListener("click", unlockAudio);
    document.addEventListener("pointerdown", unlockAudio, { once: true });

    startMessages();
  </script>
</body>
</html>
