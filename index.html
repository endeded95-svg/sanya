<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сайт опубликован</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1f2937, #111827);
      }
      .card {
        max-width: 680px;
        margin: 24px;
        padding: 28px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.95);
        color: #111827;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
      }
      h1 { margin-top: 0; }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>✅ Сайт работает</h1>
      <p>
        Этот проект автоматически публикуется через <strong>GitHub Pages</strong>
        при пуше в ветку <code>main</code>.
      </p>
      <p>
        Если вы видите эту страницу по URL GitHub Pages — публикация настроена правильно.
      </p>
    </main>
  </body>
</html>
